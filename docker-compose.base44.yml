# Base44 sandbox environment for the RCSC static site.
#
# The whole app is one static page (index.html). nginx serves the file straight
# from the bind-mounted source, so any edit is visible on the next page load —
# there is no build step to re-run.
services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "RCSC"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    environment:
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
